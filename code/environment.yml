name: crossreq
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - pandas=3.0.5
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - matplotlib=3.11.1
  - gensim=4.4.0        # vectores fastText preentrenados
  - pytorch=2.13.0      # BERT; usa MPS en Apple Silicon
  - ipykernel
  - jupyterlab          # opcional, para abrir los notebooks
  - pip
  - pip:
      - transformers==5.14.1
      - accelerate==1.14.0
      - tabulate==0.10.0
      - nbconvert==7.17.1   # ejecución de los notebooks desde la terminal
